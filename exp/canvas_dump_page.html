<!doctype html><meta charset=utf-8><body>
<script>
// Replica EXACTA del lienzo de preprocesar() en src/yolo.ts (drawImage, smoothing high, relleno 114)
window.runAll = async function(){
  const ds = (await (await fetch('/dataset.json')).json()).imagenes; const T=416; let n=0;
  for (const im of ds){
    const img = new Image(); img.src='/'+im.file_name; await img.decode();
    const w=img.naturalWidth,h=img.naturalHeight, r=Math.min(T/h,T/w), rw=Math.floor(w*r), rh=Math.floor(h*r);
    const c=document.createElement('canvas'); c.width=T;c.height=T;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='rgb(114,114,114)'; ctx.fillRect(0,0,T,T);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,rw,rh);
    const px=ctx.getImageData(0,0,T,T).data;
    await fetch('/post/'+im.id,{method:'POST',body:px}); n++;
  }
  return n+' '+navigator.userAgent;
};
</script>
