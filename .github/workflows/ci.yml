name: CI — Frontend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type-check (TS) + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Auditoria de dependencias (falla con vulnerabilidades altas)
        run: npm audit --audit-level=high

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build JS bundle
        run: npm run build
