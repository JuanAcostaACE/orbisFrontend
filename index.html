<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SmartCane AI — Panel de monitoreo para bastón inteligente con IA para personas con discapacidad visual" />
  <title>SmartCane AI — Panel de Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header" role="banner">
    <div class="header-inner">
      <div class="logo" aria-label="SmartCane AI">
        <span class="logo-icon" aria-hidden="true">🦯</span>
        <span class="logo-text">SmartCane <strong>AI</strong></span>
      </div>
      <div class="status-bar">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <span id="status-text" class="status-text">Conectando...</span>
      </div>
    </div>
  </header>

  <main class="main" role="main">
    <section class="summary" aria-label="Resumen de actividad">
      <div class="stat-card" id="stat-total">
        <span class="stat-number" id="count-total">—</span>
        <span class="stat-label">Total eventos</span>
      </div>
      <div class="stat-card" id="stat-pasivo">
        <span class="stat-number" id="count-pasivo">—</span>
        <span class="stat-label">Modo Pasivo</span>
      </div>
      <div class="stat-card" id="stat-activo">
        <span class="stat-number" id="count-activo">—</span>
        <span class="stat-label">Modo Activo</span>
      </div>
    </section>

    <section class="eventos-section" aria-label="Lista de eventos">
      <div class="section-header">
        <h1>Eventos registrados</h1>
        <button id="btn-refresh" class="btn-refresh" aria-label="Actualizar lista de eventos">
          ↻ Actualizar
        </button>
      </div>

      <div id="error-banner" class="error-banner hidden" role="alert" aria-live="polite"></div>

      <div id="loading" class="loading" aria-live="polite" aria-busy="true">
        <div class="spinner" aria-hidden="true"></div>
        <span>Cargando eventos...</span>
      </div>

      <ul id="eventos-list" class="eventos-list" role="list" aria-label="Eventos del SmartCane"></ul>

      <div id="empty-state" class="empty-state hidden" aria-live="polite">
        <span aria-hidden="true">📡</span>
        <p>Aún no hay eventos. El bastón enviará datos cuando detecte obstáculos.</p>
      </div>
    </section>
  </main>

  <!-- Template de tarjeta de evento (clonado por JS) -->
  <template id="evento-template">
    <li class="evento-card" role="listitem">
      <div class="evento-header">
        <span class="evento-modo-badge" data-modo></span>
        <span class="evento-fecha" aria-label="Fecha y hora"></span>
      </div>
      <div class="evento-body">
        <div class="evento-distancia">
          <span class="evento-label">Distancia</span>
          <span class="evento-valor distancia-valor" aria-label="Distancia en centímetros"></span>
        </div>
        <div class="evento-ia hidden">
          <span class="evento-label">Análisis IA</span>
          <span class="evento-valor ia-valor"></span>
          <button class="btn-escuchar" aria-label="Escuchar resultado en voz alta">
            🔊 Escuchar
          </button>
        </div>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
